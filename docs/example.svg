<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="SF Mono, Menlo, monospace">
  <rect width="1200" height="675" fill="#0e0e12"/>
  <line x1="600" y1="0" x2="600" y2="675" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- ================= CLAUDE (left) ================= -->
  <g>
    <text x="40" y="60" fill="#d97857" font-size="22" font-weight="600" letter-spacing="5">CLAUDE</text>
    <rect x="150" y="44" width="52" height="21" rx="4" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="158" y="59" fill="#ffffff" fill-opacity="0.58" font-size="12" font-weight="600" letter-spacing="1">MAX</text>
    <circle cx="474" cy="53" r="4.5" fill="#4dc772"/>
    <text x="486" y="58" fill="#4dc772" font-size="14" font-weight="500">WORKING ×1</text>
    <text x="40" y="86" fill="#ffffff" fill-opacity="0.34" font-size="14">gazer@example.com</text>

    <!-- big: Session 5h -->
    <text x="40" y="168" fill="#ffffff" fill-opacity="0.92" font-size="72" font-weight="300">47</text>
    <text x="128" y="168" fill="#ffffff" fill-opacity="0.58" font-size="30" font-weight="300">%</text>
    <text x="560" y="150" text-anchor="end" fill="#ffffff" fill-opacity="0.58" font-size="16" font-weight="500">Session 5h</text>
    <text x="560" y="170" text-anchor="end" fill="#ffffff" fill-opacity="0.34" font-size="13">resets in 2h 10m</text>
    <rect x="40" y="188" width="520" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="40" y="188" width="244" height="9" rx="4.5" fill="#d97857"/>
    <rect x="325" y="185" width="2" height="15" fill="#ffffff" fill-opacity="0.85"/>
    <text x="40" y="222" fill="#4dc772" font-size="13" font-weight="500">▼ 8% under pace</text>

    <!-- weekly -->
    <text x="40" y="270" fill="#ffffff" fill-opacity="0.58" font-size="14" font-weight="500">Weekly 7d</text>
    <text x="500" y="270" text-anchor="end" fill="#ffffff" fill-opacity="0.34" font-size="13">resets in 3d 4h</text>
    <text x="560" y="270" text-anchor="end" fill="#ffffff" fill-opacity="0.92" font-size="15" font-weight="500">38%</text>
    <rect x="40" y="280" width="520" height="6" rx="3" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="40" y="280" width="198" height="6" rx="3" fill="#d97857"/>
    <rect x="268" y="278" width="2" height="12" fill="#ffffff" fill-opacity="0.85"/>
    <text x="40" y="306" fill="#4dc772" font-size="13" font-weight="500">▼ 6% under pace</text>

    <line x1="40" y1="345" x2="560" y2="345" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <text x="40" y="378" fill="#ffffff" fill-opacity="0.34" font-size="12" font-weight="600" letter-spacing="2">TASKS</text>
    <circle cx="45" cy="405" r="3.5" fill="#4dc772"/>
    <text x="60" y="410" fill="#ffffff" fill-opacity="0.92" font-size="14" font-weight="500">my-web-app</text>
    <text x="560" y="410" text-anchor="end" fill="#ffffff" fill-opacity="0.34" font-size="13">14m</text>
    <text x="42" y="438" fill="#ffffff" fill-opacity="0.34" font-size="13" font-weight="700">✓</text>
    <text x="60" y="438" fill="#ffffff" fill-opacity="0.58" font-size="14">api-server</text>
    <text x="560" y="438" text-anchor="end" fill="#ffffff" fill-opacity="0.34" font-size="13">done 8m ago</text>

    <text x="40" y="640" fill="#ffffff" fill-opacity="0.34" font-size="11">updated 14:32</text>
  </g>

  <!-- ================= CODEX (right) ================= -->
  <g transform="translate(600,0)">
    <text x="40" y="60" fill="#10a37f" font-size="22" font-weight="600" letter-spacing="5">CODEX</text>
    <rect x="140" y="44" width="58" height="21" rx="4" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="148" y="59" fill="#ffffff" fill-opacity="0.58" font-size="12" font-weight="600" letter-spacing="1">PLUS</text>
    <circle cx="486" cy="53" r="4.5" fill="none" stroke="#f2bf40" stroke-width="1.3"/>
    <text x="498" y="58" fill="#f2bf40" font-size="14" font-weight="500">IDLE ×1</text>
    <text x="40" y="86" fill="#ffffff" fill-opacity="0.34" font-size="14">gazer@example.com</text>

    <!-- big: Weekly 7d (Codex has no active 5h window here) -->
    <text x="40" y="168" fill="#ffffff" fill-opacity="0.92" font-size="72" font-weight="300">61</text>
    <text x="128" y="168" fill="#ffffff" fill-opacity="0.58" font-size="30" font-weight="300">%</text>
    <text x="560" y="150" text-anchor="end" fill="#ffffff" fill-opacity="0.58" font-size="16" font-weight="500">Weekly 7d</text>
    <text x="560" y="170" text-anchor="end" fill="#ffffff" fill-opacity="0.34" font-size="13">resets in 5d 3h</text>
    <rect x="40" y="188" width="520" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="40" y="188" width="317" height="9" rx="4.5" fill="#10a37f"/>
    <rect x="174" y="185" width="2" height="15" fill="#ffffff" fill-opacity="0.85"/>
    <text x="40" y="222" fill="#f0594d" font-size="13" font-weight="500">▲ 35% over pace</text>

    <!-- 5h placeholder -->
    <text x="40" y="270" fill="#ffffff" fill-opacity="0.30" font-size="14" font-weight="500">Session 5h</text>
    <text x="560" y="270" text-anchor="end" fill="#ffffff" fill-opacity="0.30" font-size="13">no active window</text>

    <line x1="40" y1="345" x2="560" y2="345" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <text x="40" y="378" fill="#ffffff" fill-opacity="0.34" font-size="12" font-weight="600" letter-spacing="2">TASKS</text>
    <circle cx="45" cy="405" r="3.5" fill="none" stroke="#f2bf40" stroke-width="1.3"/>
    <text x="60" y="410" fill="#ffffff" fill-opacity="0.92" font-size="14" font-weight="500">data-pipeline</text>
    <text x="560" y="410" text-anchor="end" fill="#ffffff" fill-opacity="0.34" font-size="13">3m</text>

    <text x="40" y="640" fill="#ffffff" fill-opacity="0.34" font-size="11">updated 14:32</text>
  </g>
</svg>
